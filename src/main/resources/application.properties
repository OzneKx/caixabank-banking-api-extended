# ------------------------------
# SERVER CONFIGURATION
# ------------------------------
server.port=${SERVER_PORT:3000}
spring.application.name=CaixaBank Banking API - Extended

# ------------------------------
# DATABASE CONFIGURATION
# ------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finservice_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}

# JPA and Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ------------------------------
# JWT CONFIGURATION
# ------------------------------
jwt.secret=${JWT_SECRET:mySuperSecretKey123}
jwt.expiration=3600000   # 1 hour (in milliseconds)

# ------------------------------
# SWAGGER / OPENAPI CONFIGURATION
# ------------------------------
# Base server URL used in OpenApiConfig.java
swagger.server.url=${SWAGGER_SERVER_URL:http://localhost:3000}

# Swagger UI and OpenAPI Docs paths
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

# ------------------------------
# LOGGING LEVELS
# ------------------------------
logging.level.org.springframework=INFO
logging.level.com.hackathon=DEBUG