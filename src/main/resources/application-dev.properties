server.port=3000

spring.datasource.url=jdbc:mysql://localhost:3306/finservice_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=mySuperSecretKey123
jwt.expiration=3600000

swagger.server.url=${SWAGGER_SERVER_URL:http://localhost:3000}
springdoc.swagger-ui.path=/swagger-ui
springdoc.api-docs.path=/v3/api-docs

logging.level.org.springframework=INFO
logging.level.com.hackathon=DEBUG